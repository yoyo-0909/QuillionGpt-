<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Quillion GPT — One Platform. Endless Intelligence.</title>
  <desc id="desc">A vibrant purple, blue, and teal gradient banner with a glowing abstract Q mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171044"/>
      <stop offset=".48" stop-color="#4523A5"/>
      <stop offset="1" stop-color="#087F91"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset=".48" stop-color="#FF6FAE"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9EE7FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9EE7FF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9EE7FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity=".17"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <circle cx="1010" cy="72" r="190" fill="#6F6BFF" opacity=".16"/>
  <circle cx="1110" cy="310" r="180" fill="#19D3C5" opacity=".14"/>
  <path d="M0 278 C260 180 380 390 650 260 S1000 160 1200 220" fill="none" stroke="url(#line)" stroke-width="2"/>
  <g transform="translate(890 72)" filter="url(#glow)">
    <circle cx="110" cy="108" r="82" fill="none" stroke="url(#orb)" stroke-width="20"/>
    <path d="M153 153 L211 211" stroke="#FFC5E2" stroke-width="22" stroke-linecap="round"/>
    <circle cx="110" cy="108" r="18" fill="#FFFFFF" opacity=".9"/>
  </g>
  <g fill="#FFFFFF">
    <text x="78" y="142" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5" opacity=".78">YOUR AI WORKSPACE</text>
    <text x="72" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-3">Quillion GPT</text>
    <text x="78" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="500" opacity=".88">One Platform. Endless Intelligence.</text>
  </g>
  <g fill="#FFFFFF" opacity=".72">
    <circle cx="788" cy="65" r="4"/><circle cx="835" cy="290" r="5"/><circle cx="1080" cy="35" r="3"/>
    <circle cx="1160" cy="150" r="4"/><circle cx="720" cy="130" r="3"/>
  </g>
  <rect x="78" y="305" width="220" height="3" rx="2" fill="#FFB86B"/>
  <rect x="304" y="305" width="112" height="3" rx="2" fill="#FF6FAE"/>
  <rect x="422" y="305" width="76" height="3" rx="2" fill="#7FE8D8"/>
</svg>